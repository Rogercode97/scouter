name: Bug Report
description: Create a report to help us improve
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you have searched for existing issues before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue? (Provide exact commands or code)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scouter Version
      description: e.g., 2.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS / Environment
      description: e.g., Linux, macOS, Windows
    validations:
      required: true
