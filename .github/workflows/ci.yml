name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        
    - name: Install dependencies
      run: go mod download
        
    - name: Verify formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Error: Code is not formatted. Run 'go fmt ./...' locally."
          gofmt -s -d .
          exit 1
        fi
        
    - name: Vet
      run: go vet ./...
      
    - name: Test
      run: go test -v -cover ./...
