schema: hybrid

context: |
  Tech stack: Go 1.25.0, SQLite (modernc.org/sqlite), Tree-sitter (bindings/go)
  Architecture: MCP Server (Stdio), Hexagonal Architecture (Repository Pattern), Context-First I/O
  Intelligence: Oracle Edition (Scouter v2.5.1), Selective Testing, Blast Radius Analysis
  Testing: go test (Strict TDD Mode Enabled)
  Style: go fmt, go vet

strict_tdd: true

rules:
  proposal:
    - MANDATORY: Include 'scouter_impact' analysis for target symbols
    - Identify affected modules using the Call Graph
  specs:
    - Use Given/When/Then format for scenarios
    - Link scenarios to structural symbols identified by Scouter
  design:
    - Include sequence diagrams for complex flows
    - Use 'scouter_critical_code' to avoid hotspots
    - Document implementation links discovered by 'Lazo Soberano'
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Add 'scouter_index' to post-implementation tasks
  apply:
    - Use 'scouter_predict' to monitor real-time impact
    - Follow existing code patterns and conventions
  verify:
    - MANDATORY: Run 'scouter strike' for selective verification
    - Compare implementation against every spec scenario
  archive:
    - Update '.scouter/sync/' using 'scouter sync --push'
    - Warn before merging destructive deltas

testing:
  runner:
    command: "scouter strike" # Sinergia Directa: Strike como runner por defecto
    framework: "go test + scouter oracle"
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: true
    command: "go test -cover ./..."
  quality:
    linter: false
    type_checker: "go vet ./..."
    formatter: "go fmt ./..."
